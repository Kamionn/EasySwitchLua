name: Release

# Trigger on tag pushes that look like a version (`v2.0.0`, `v2.1.0-beta`, ...).
# Tag the commit, push the tag, and a draft release with the zip attached
# is created automatically. Edit the release notes in the GitHub UI before
# publishing.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed by softprops/action-gh-release to create releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lua 5.4
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Build the bundled distribution
        run: lua build.lua

      - name: Sanity check — run tests against the bundle
        run: lua tests/test_all.lua dist

      - name: Stage the release tree
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          STAGE="release/EasySwitchLua-${REF_NAME}"
          mkdir -p "${STAGE}/easyswitch-type"

          # Two dist files at the root, alongside the README + LICENSE.
          cp dist/easyswitch.lua     "${STAGE}/"
          cp dist/easyswitch.min.lua "${STAGE}/"

          # Type defs go into easyswitch-type/.
          cp types/*.d.lua "${STAGE}/easyswitch-type/"

          # The repo README ships unchanged in the zip — single source of truth.
          cp README.md "${STAGE}/README.md"
          cp LICENSE   "${STAGE}/"

          ls -la "${STAGE}"
          ls -la "${STAGE}/easyswitch-type"

      - name: Create the zip archive
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          zip -r "../EasySwitchLua-${REF_NAME}.zip" "EasySwitchLua-${REF_NAME}"
          cd ..
          ls -la "EasySwitchLua-${REF_NAME}.zip"

      - name: Create the GitHub release (draft) and upload the zip
        uses: softprops/action-gh-release@v2
        with:
          name: EasySwitchLua ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: EasySwitchLua-${{ github.ref_name }}.zip
